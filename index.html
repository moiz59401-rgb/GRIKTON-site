<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grikton</title>
    <style>
        /* Loading Spinner/Overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #c0c0c0;
            font-family: Arial, sans-serif;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #c0c0c0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* General Styles */
        body {
            background-color: #0d0d0d;
            color: #c0c0c0;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .header {
            padding: 40px 20px;
        }

        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #e0e0e0;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0px 0px 5px rgba(192, 192, 192, 0.3);
        }

        p.tagline {
            font-size: 1.2rem;
            color: #a6a6a6;
            font-style: italic;
            margin-bottom: 30px;
        }

        /* Store Products Section */
        .product-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .product-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .product-title {
            font-size: 1.3rem;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.1rem;
            color: #c0c0c0;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-cart {
            background-color: #333;
            color: #c0c0c0;
            border: 1px solid #555;
        }

        .btn-cart:hover {
            background-color: #444;
        }

        .btn-buy {
            background-color: #c0c0c0;
            color: #0d0d0d;
        }

        .btn-buy:hover {
            background-color: #e0e0e0;
        }

        /* WhatsApp Corner Button */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Grikton - Loading...</p>
    </div>

    <!-- Main Content -->
    <div class="header">
        <!-- Logo Image -->
        <img src="logo.png" alt="Grikton Logo" class="logo">
        <h1>Grikton</h1>
        <p class="tagline">Buy Now and Upgrade Your Personality</p>
    </div>

    <!-- Store Products -->
    <div class="product-grid">
        <div class="product-card">
            <div class="product-title">Sample Product</div>
            <div class="price">PKR 2,500</div>
            <div class="btn-group">
                <button class="btn btn-cart">Add to Cart</button>
                <button class="btn btn-buy">Buy Now</button>
            </div>
        </div>
    </div>

    <!-- WhatsApp Button (03496217478) -->
    <a href="https://wa.me/923496217478" class="whatsapp-btn" target="_blank">
        WhatsApp
    </a>

    <script>
        // Loading Screen Hide Function
        window.addEventListener('load', function() {
            document.getElementById('loader').style.display = 'none';
        });
    </script>

</body>
  </html>
